name: Hub Desktop
run-name: Hub ${{ inputs.platform }} · ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character commit SHA on private Hub main
        required: true
        type: string
      platform:
        description: Desktop platform
        required: true
        type: choice
        default: macos
        options: [macos, windows, both]
      upload_installers:
        description: Allow signed package downloads from this PUBLIC repository (no Release)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hub-desktop
  cancel-in-progress: false

jobs:
  macos:
    if: github.repository == 'sengmitnick/sengclaw-builder' && github.ref == 'refs/heads/main' && (inputs.platform == 'macos' || inputs.platform == 'both')
    runs-on: macos-15
    timeout-minutes: 75
    environment: macos-release
    defaults:
      run:
        working-directory: hub
    steps:
      - name: Check immutable source input
        working-directory: .
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: '[[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]'
      - name: Check out Builder
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check out private Hub with its own read-only key
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: sengmitnick/sengclaw-hub
          ref: main
          ssh-key: ${{ secrets.HUB_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 0
          path: hub
      - name: Validate source and Apple Silicon
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$(uname -m)" = arm64
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: pip install uv==0.12.9
      - run: uv sync --locked --group desktop --python 3.12.14
      - run: uv run --locked ruff check workflow tests scripts
      - run: uv run --locked ruff format --check workflow tests scripts
      - run: uv run --locked python -m unittest discover -s tests -q
      - run: npm ci && npm run check
        working-directory: hub/desktop
      - name: Sign and notarize using Builder's existing Apple credentials
        env:
          HUB_P12_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          HUB_P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          HUB_NOTARY_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          HUB_NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          HUB_NOTARY_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          HUB_APPLE_TEAM_ID: 87WNRG9285
        run: node desktop/scripts/release-macos-ci.mjs
      - run: cargo test --locked
        working-directory: hub/desktop/src-tauri
      - name: Upload only verified installer and release receipt
        if: success() && inputs.upload_installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Hub-macos-${{ inputs.source_sha }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true
          path: |
            hub/.runtime/releases/*/*.zip
            hub/.runtime/releases/*/release.json

  windows:
    if: github.repository == 'sengmitnick/sengclaw-builder' && github.ref == 'refs/heads/main' && (inputs.platform == 'windows' || inputs.platform == 'both')
    runs-on: windows-2022
    timeout-minutes: 60
    environment: windows-release
    defaults:
      run:
        working-directory: hub
        shell: bash
    steps:
      - name: Check immutable source input
        working-directory: .
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: '[[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]'
      - name: Check out Builder
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check out private Hub with its own read-only key
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: sengmitnick/sengclaw-hub
          ref: main
          ssh-key: ${{ secrets.HUB_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 0
          path: hub
      - name: Validate source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: pip install uv==0.12.9
      - run: uv sync --locked --group desktop --python 3.12.14
      - name: Check out pinned SSL.com signing adapter
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SSLcom/esigner-codesign
          ref: b7f8ff36fc0de8690fbbab8e5b4421d29802f747
          persist-credentials: false
          path: signing-adapter
      - name: Check Windows signing tool before compiling
        working-directory: .
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          CREDENTIAL_ID: ${{ secrets.CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        run: node scripts/hub-windows-sign.mjs --preflight
      - run: npm ci && npm run check && npm run prepare:sidecar && npx tauri build --no-bundle --config src-tauri/tauri.windows.conf.json
        working-directory: hub/desktop
      - run: cargo test --locked
        working-directory: hub/desktop/src-tauri
      - name: Sign portable executables and create ZIP
        working-directory: .
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          CREDENTIAL_ID: ${{ secrets.CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        run: node scripts/hub-windows-release.mjs
      - name: Verify portable files and produce download receipt
        working-directory: .
        shell: pwsh
        run: ./scripts/verify-hub-windows-portable.ps1
      - name: Upload verified signed Windows portable ZIP
        if: success() && inputs.upload_installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Hub-windows-signed-${{ inputs.source_sha }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: |
            hub/.runtime/releases/windows-portable/*.zip
            hub-windows-receipt.json

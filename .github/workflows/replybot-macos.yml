name: ReplyBot macOS

run-name: ReplyBot macOS · ${{ inputs.ref }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: ReplyBot branch, tag, or commit SHA
        required: true
        type: string
        default: main

permissions:
  contents: write

concurrency:
  group: replybot-macos-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  signed-arm64-dmg:
    runs-on: macos-15
    timeout-minutes: 75
    environment: macos-release
    env:
      REPLYBOT_APP_DIR: ${{ github.workspace }}/replybot
      REPLYBOT_ASSETS_DIR: ${{ github.workspace }}/assets
      REPLYBOT_TEST_DATABASE_URL: postgresql:///replybot_test?host=/tmp

    steps:
      - name: Check out builder
        uses: actions/checkout@v7

      - name: Check out private ReplyBot source
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.REPLYBOT_REPOSITORY }}
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.REPLYBOT_DEPLOY_KEY }}
          path: replybot
          lfs: true
          fetch-depth: 1

      - name: Confirm Apple Silicon and Git LFS
        run: |
          test "$(uname -m)" = "arm64"
          git lfs version
          git -C replybot lfs pull

      - name: Confirm release version is new
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_version="$(node -p "require('./replybot/apps/desktop/package.json').version")"
          release_tag="v${release_version}"
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${release_tag} already exists and will not be overwritten" >&2
            exit 1
          fi
          printf 'version=%s\n' "$release_version" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$release_tag" >> "$GITHUB_OUTPUT"
          printf 'source_sha=%s\n' "$(git -C replybot rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.28.4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: replybot/pnpm-lock.yaml

      - name: Start PostgreSQL 16
        run: |
          brew install postgresql@16
          export PATH="$(brew --prefix postgresql@16)/bin:$PATH"
          initdb --auth=trust -D "$RUNNER_TEMP/replybot-postgres"
          pg_ctl -D "$RUNNER_TEMP/replybot-postgres" -l "$RUNNER_TEMP/postgresql.log" -o "-k /tmp" start
          createdb -h /tmp replybot_test

      - name: Validate public builder configuration
        run: |
          bash -n scripts/*.sh
          node --test tests/*.test.mjs

      - name: Build, sign, notarize, and verify ReplyBot
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          PRODUCTION_LICENSE_PUBLIC_KEY_BASE64: ${{ secrets.PRODUCTION_LICENSE_PUBLIC_KEY_BASE64 }}
          PRODUCTION_LICENSE_PUBLIC_KEY_SHA256: ${{ secrets.PRODUCTION_LICENSE_PUBLIC_KEY_SHA256 }}
        run: scripts/build-replybot-macos.sh

      - name: Upload verified DMG
        uses: actions/upload-artifact@v6
        with:
          name: ReplyBot-${{ github.run_id }}-arm64
          if-no-files-found: error
          retention-days: 14
          path: |
            assets/*.dmg
            assets/*.dmg.sha256

      - name: Publish public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          REPLYBOT_SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        run: |
          versioned_dmg="assets/ReplyBot-${RELEASE_VERSION}-arm64.dmg"
          public_dmg="assets/ReplyBot-macOS-arm64.dmg"
          public_checksum="${public_dmg}.sha256"
          test -f "$versioned_dmg"
          cp "$versioned_dmg" "$public_dmg"
          (
            cd assets
            shasum -a 256 "$(basename "$public_dmg")" > "$(basename "$public_checksum")"
          )
          release_notes="$RUNNER_TEMP/replybot-release-notes.md"
          {
            printf 'ReplyBot %s for macOS Apple Silicon.\n\n' "$RELEASE_VERSION"
            printf -- '- Developer ID signed and Apple notarized\n'
            printf -- '- Bundle ID: `com.sengclaw.reply`\n'
            printf -- '- Source revision: `%s`\n' "$REPLYBOT_SOURCE_SHA"
            printf -- '- CI run: %s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            printf -- '- SHA-256: `%s`\n\n' "$(shasum -a 256 "$public_dmg" | awk '{print $1}')"
            printf 'Open ReplyBot, copy the device ID from License, and ask your ReplyBot administrator for a Production License.\n'
          } > "$release_notes"
          gh release create "$RELEASE_TAG" \
            "$public_dmg#ReplyBot for macOS Apple Silicon" \
            "$public_checksum#SHA-256 checksum" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ReplyBot v${RELEASE_VERSION}" \
            --notes-file "$release_notes" \
            --latest

      - name: Stop PostgreSQL
        if: always()
        run: |
          export PATH="$(brew --prefix postgresql@16)/bin:$PATH"
          pg_ctl -D "$RUNNER_TEMP/replybot-postgres" stop || true

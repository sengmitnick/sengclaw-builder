name: Shared macOS Tauri Python builder

on:
  workflow_call:
    inputs:
      application:
        description: Artifact label; source and artifacts remain in the caller repository
        type: string
        required: true
    secrets:
      certificate_base64:
        required: true
      p12_password:
        required: true
      notary_key_base64:
        required: true
      notary_key_id:
        required: true
      notary_issuer:
        required: true
      apple_team_id:
        required: true

permissions:
  contents: read

concurrency:
  group: signed-macos-${{ github.repository }}
  cancel-in-progress: false

jobs:
  signed-arm64:
    if: github.repository_owner == 'sengmitnick' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      # Reusable checkout resolves to the caller, not the public builder repository.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate caller and build contract
        env:
          EXPECTED_SHA: ${{ github.sha }}
          APPLICATION: ${{ inputs.application }}
        run: |
          [[ "$APPLICATION" =~ ^[a-z0-9-]{1,60}$ ]]
          test "$(uname -m)" = arm64
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          test -f desktop/scripts/release-macos-ci.mjs
          test -f desktop/src-tauri/Cargo.lock
          test -f uv.lock
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: pip install uv==0.12.9
      - run: uv sync --locked --group desktop --python 3.12.14
      - run: uv run --locked ruff check workflow tests scripts
      - run: uv run --locked ruff format --check workflow tests scripts
      - run: uv run --locked python -m unittest discover -s tests -q
      - run: npm ci && npm run check
        working-directory: desktop
      - name: Build sign notarize and verify caller application
        env:
          HUB_P12_BASE64: ${{ secrets.certificate_base64 }}
          HUB_P12_PASSWORD: ${{ secrets.p12_password }}
          HUB_NOTARY_KEY_BASE64: ${{ secrets.notary_key_base64 }}
          HUB_NOTARY_KEY_ID: ${{ secrets.notary_key_id }}
          HUB_NOTARY_ISSUER: ${{ secrets.notary_issuer }}
          HUB_APPLE_TEAM_ID: ${{ secrets.apple_team_id }}
        run: node desktop/scripts/release-macos-ci.mjs
      - run: cargo test --locked
        working-directory: desktop/src-tauri
      - name: Retain candidate and receipts in the caller repository
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.application }}-macos-candidate-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            .runtime/releases/*/*.zip
            .runtime/releases/*/notary-submission.json
            .runtime/releases/*/notary-status.json
            .runtime/releases/*/notary-log.json
            .runtime/releases/*/release.json

# This profile does not publish a public Release or inherit builder Environment secrets.
